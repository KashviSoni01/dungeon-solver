<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dungeon Solver</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="game">

        <!-- =========================
             HEADER
        ========================== -->

        <header>

            <div class="title-area">
                <div class="title-icon">◆</div>

                <h1>Dungeon Solver</h1>
            </div>


            <div class="stats">

                <div class="stat">
                    <span>TIME</span>
                    <strong id="timer">00:00</strong>
                </div>

                <div class="stat">
                    <span>MOVES</span>
                    <strong id="moves">0</strong>
                </div>

                <div class="stat">
                    <span>LEVEL</span>
                    <strong id="level">1 / 3</strong>
                </div>

            </div>

        </header>


        <!-- =========================
             DUNGEON
        ========================== -->

        <main>

            <div class="dungeon-frame">

                <div id="dungeon"></div>

            </div>

        </main>


        <!-- =========================
             CONTROLS
        ========================== -->

        <div class="controls">

            <button id="restart">

                <span class="key">R</span>

                <span>RESTART</span>

            </button>


            <button id="pause">

                <span class="key">ESC</span>

                <span>PAUSE</span>

            </button>

        </div>

    </div>


    <!-- =========================
         PAUSE SCREEN
    ========================== -->

    <div id="pauseScreen">

        <div class="pauseBox">

            <h2>GAME PAUSED</h2>

            <p>
                The dungeon awaits your return.
            </p>

            <button id="resume">
                RESUME
            </button>

        </div>

    </div>


    <!-- =========================
         WIN SCREEN
    ========================== -->

    <div id="winScreen">

        <div class="winBox">

            <div class="winIcon">
                ◆
            </div>

            <h2>LEVEL COMPLETE</h2>

            <p>
                You escaped the dungeon!
            </p>


            <div class="finalStats">

                <div>
                    <span>TIME</span>
                    <strong id="winTime">00:00</strong>
                </div>

                <div>
                    <span>MOVES</span>
                    <strong id="winMoves">0</strong>
                </div>

            </div>


            <button id="nextLevel">
                NEXT LEVEL
            </button>


            <button id="playAgain">
                PLAY AGAIN
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
