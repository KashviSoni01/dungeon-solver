<svg xmlns="http://www.w3.org/2000/svg"
     width="64"
     height="64"
     viewBox="0 0 64 64"
     shape-rendering="crispEdges">

    <!-- Outer shield frame -->
    <rect x="14" y="4" width="36" height="4" fill="#c89636"/>
    <rect x="10" y="8" width="44" height="2" fill="#c89636"/>
    <rect x="8" y="10" width="2" height="34" fill="#c89636"/>
    <rect x="54" y="10" width="2" height="34" fill="#c89636"/>
    <rect x="10" y="44" width="44" height="2" fill="#c89636"/>
    <rect x="14" y="46" width="8" height="2" fill="#c89636"/>
    <rect x="42" y="46" width="8" height="2" fill="#c89636"/>
    <rect x="22" y="48" width="6" height="2" fill="#c89636"/>
    <rect x="36" y="48" width="6" height="2" fill="#c89636"/>
    <rect x="28" y="50" width="8" height="2" fill="#c89636"/>
    <rect x="30" y="52" width="4" height="2" fill="#c89636"/>
    <rect x="31" y="54" width="2" height="2" fill="#c89636"/>

    <!-- gold highlights -->
    <rect x="14" y="4" width="36" height="1" fill="#ffd96b"/>
    <rect x="10" y="8" width="2" height="1" fill="#ffd96b"/>
    <rect x="8" y="10" width="1" height="2" fill="#ffd96b"/>

    <!-- dark inner shadow -->
    <rect x="54" y="42" width="2" height="2" fill="#8a6420"/>
    <rect x="32" y="54" width="2" height="2" fill="#8a6420"/>

    <!-- Inner blue field -->
    <rect x="12" y="10" width="40" height="2" fill="#173e68"/>
    <rect x="10" y="12" width="2" height="32" fill="#173e68"/>
    <rect x="52" y="12" width="2" height="32" fill="#173e68"/>
    <rect x="12" y="44" width="8" height="2" fill="#173e68"/>
    <rect x="44" y="44" width="8" height="2" fill="#173e68"/>
    <rect x="22" y="46" width="6" height="2" fill="#173e68"/>
    <rect x="36" y="46" width="6" height="2" fill="#173e68"/>
    <rect x="28" y="48" width="8" height="2" fill="#173e68"/>
    <rect x="30" y="50" width="4" height="2" fill="#173e68"/>
    <rect x="31" y="52" width="2" height="2" fill="#173e68"/>

    <!-- field gradient lighter -->
    <rect x="14" y="14" width="36" height="1" fill="#245f99"/>
    <rect x="12" y="14" width="2" height="28" fill="#1a4570"/>
    <rect x="50" y="14" width="2" height="28" fill="#1a4570"/>
    <rect x="14" y="42" width="6" height="1" fill="#1a4570"/>
    <rect x="44" y="42" width="6" height="1" fill="#1a4570"/>
    <rect x="22" y="44" width="4" height="1" fill="#1a4570"/>
    <rect x="38" y="44" width="4" height="1" fill="#1a4570"/>

    <!-- Inner blue main -->
    <rect x="14" y="15" width="36" height="27" fill="#12345a"/>
    <rect x="16" y="16" width="32" height="1" fill="#1a4a7a"/>
    <rect x="14" y="15" width="1" height="27" fill="#0e2a48"/>
    <rect x="49" y="15" width="1" height="27" fill="#0e2a48"/>
    <rect x="16" y="41" width="32" height="1" fill="#0e2a48"/>

    <!-- Dungeon icon: key + tower -->
    <!-- tower base -->
    <rect x="20" y="34" width="24" height="2" fill="#347fc1"/>
    <rect x="22" y="32" width="20" height="2" fill="#347fc1"/>
    <rect x="26" y="30" width="2" height="2" fill="#347fc1"/>
    <rect x="36" y="30" width="2" height="2" fill="#347fc1"/>
    <rect x="30" y="28" width="4" height="2" fill="#347fc1"/>

    <!-- tower windows -->
    <rect x="26" y="35" width="2" height="1" fill="#ffd96b"/>
    <rect x="36" y="35" width="2" height="1" fill="#ffd96b"/>
    <rect x="31" y="33" width="2" height="1" fill="#5dd3ff"/>

    <!-- Key icon crossing -->
    <!-- key bow -->
    <rect x="20" y="18" width="8" height="2" fill="#ffd96b"/>
    <rect x="18" y="20" width="2" height="6" fill="#ffd96b"/>
    <rect x="28" y="20" width="2" height="6" fill="#ffd96b"/>
    <rect x="20" y="26" width="8" height="2" fill="#ffd96b"/>
    <rect x="22" y="19" width="4" height="1" fill="#fff2b0"/>
    <!-- key hole -->
    <rect x="22" y="21" width="4" height="4" fill="#12345a"/>
    <!-- key shaft -->
    <rect x="30" y="22" width="14" height="2" fill="#ffd96b"/>
    <rect x="30" y="21" width="13" height="1" fill="#fff2b0"/>
    <!-- key teeth -->
    <rect x="38" y="24" width="2" height="2" fill="#ffd96b"/>
    <rect x="35" y="24" width="2" height="3" fill="#ffd96b"/>

    <!-- sparkle accents -->
    <rect x="16" y="16" width="1" height="1" fill="#8de4ff"/>
    <rect x="47" y="16" width="1" height="1" fill="#8de4ff"/>
    <rect x="47" y="40" width="1" height="1" fill="#8de4ff"/>
    <rect x="16" y="40" width="1" height="1" fill="#ffd96b"/>

</svg>
